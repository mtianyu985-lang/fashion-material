<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F7F5F0">
  <title>服装设计素材库</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* 加载状态 */
    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F7F5F0;
      z-index: 9999;
      font-family: 'Noto Serif SC', serif;
      font-size: 1.25rem;
      color: #2B2B2B;
    }
  </style>
</head>
<body>

  <!-- 加载态 -->
  <div class="loading" id="loading">加载中...</div>

  <!-- 主容器 -->
  <div id="app" style="display:none;">
    <!-- 顶部栏 -->
    <header class="header" id="header"></header>
    
    <!-- 搜索栏 -->
    <div class="search-bar" id="search-bar"></div>
    
    <!-- 分类筛选 -->
    <div class="filter-tabs" id="filter-tabs"></div>
    
    <!-- 主内容区 -->
    <main class="main" id="main"></main>
    
    <!-- 底部导航 -->
    <nav class="bottom-bar" id="bottom-bar"></nav>
  </div>

  <!-- 素材详情页 -->
  <div class="detail-overlay" id="detail-overlay"></div>

  <!-- 画布页 -->
  <div class="canvas-overlay" id="canvas-overlay"></div>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="modal-overlay"></div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 脚本 -->
  <script src="lib/fabric.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/canvas.js"></script>
  <script>
    // 初始化完成后隐藏加载态
    window.addEventListener('load', async () => {
      try {
        await init();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = '';
      } catch (err) {
        document.getElementById('loading').textContent = '加载失败: ' + err.message;
      }
    });
    
    // 注册 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('✅ SW 注册成功:', reg.scope))
          .catch(err => console.warn('SW 注册失败:', err));
      });
    }
  </script>

</body>
</html>
